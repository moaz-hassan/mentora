version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: mentora-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: mentora
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    container_name: mentora-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mongo-express:
    image: mongo-express:latest
    container_name: mentora-mongo-express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb

volumes:
  mongo_data:
  redis_data:
